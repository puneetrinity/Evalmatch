[phases.setup]
aptPkgs = ["curl"]
nixPkgs = ["nodejs-20_x", "npm-10_x"]

[phases.install]
cmds = [
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "mkdir -p dist/migrations",
    "cp -v server/migrations/*.sql dist/migrations/",
    "ls -la dist/migrations/",
    # Ensure ESCO SQLite DB is present at runtime when using Nixpacks
    "mkdir -p build/server/data",
    "cp -v server/data/esco_skills.db build/server/data/ || true",
    "ls -la build/server/data/ || true"
]

[phases.start]
cmd = "npm start"

[variables]
NODE_ENV = "production"
NODE_VERSION = "20.16.0"
